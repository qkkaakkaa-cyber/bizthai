# 把内部同步接口反代到 ingest 服务(9188),并锁死为仅对端同步服务器可访问。
# 放进 bizthai.com.conf(以及 www2.bizthai.com.conf)的 server{} 块,置于通用 /api/ location 之前。
#
# location 前缀匹配,更长更具体者优先;^~ 命中后不再尝试正则 location(不会被 `~ \.html$` 等抢走)。
#
# 安全要点:
#   1) IP 白名单:把 <SYNC_SERVER_IP> 换成对端同步服务器的固定出口 IP(可多行 allow)。
#   2) 不缓存:写接口绝不能进 nginx 页面缓存。
#   3) Authorization 透传:proxy 默认透传;显式声明以防被上游 location 清除。
#   4) 请求体上限与 ingest 的 MAX_BODY_BYTES 对齐(此处 64MB)。

location ^~ /api/internal/dbd/ {
    allow 127.0.0.1;
    allow 156.238.230.118;         # 对端同步服务器出口 IP
    deny all;

    client_max_body_size 64m;

    proxy_pass http://127.0.0.1:9188;
    proxy_http_version 1.1;
    proxy_cache off;
    proxy_buffering off;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization     $http_authorization;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
