# 本地 nginx 前置:按路径把分析/董事 API 分发到边车,*.html 交给 resolver 做 SSR 注入,其余到 WooCMS。
# 复刻线上 dbdadmin 的分发。容器网络内按服务名解析。
events { worker_connections 1024; }
http {
  sendfile on;
  client_max_body_size 50m;
  proxy_read_timeout 120s;

  upstream woocms    { server woocms:8183;    }
  upstream analytics { server analytics:8084; }
  upstream directors { server directors:8085; }
  upstream resolver  { server resolver:8186;  }
  upstream ai        { server ai:8087;        }

  # 体检发现:本地 nginx 全面缺安全响应头 + 限流,AI/董事反查(PII)/商业分析三个 sidecar
  # 均无鉴权直接反代——这里补上作为可直接搬到生产 vhost 的测试通过范本。
  # 限流阈值经验值:AI 每次请求都起无头 Chrome/调 DeepSeek,成本最高,限最严;
  # directors 涉及证件号反查 PII,其次;analytics 是聚合查询,相对宽松。
  limit_req_zone $binary_remote_addr zone=ai_zone:10m rate=5r/s;
  limit_req_zone $binary_remote_addr zone=directors_zone:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=analytics_zone:10m rate=20r/s;

  server {
    listen 80;

    # 安全响应头:对本 server 块下所有 location 生效(nginx 特性:location 一旦自己写了
    # add_header 就不再继承 server 级的,本文件目前没有任何 location 自带 add_header,
    # 故这里加在 server 级即可覆盖全部路径,无需逐个 location 重复)。
    # 实测发现 WooCMS 自己已经会发 X-Frame-Options/X-Content-Type-Options/Referrer-Policy
    # (以及更完整的 CSP frame-ancestors/COOP/Permissions-Policy,原生就比预期规范)——
    # 先 proxy_hide_header 摘掉上游的这三个,避免和下面 add_header 重复(浏览器/安全扫描器
    # 看到同名响应头出现两次会判定为配置错误);resolver/analytics/directors/ai 四个
    # sidecar 自己完全不设这些头,加在这里能统一补上。HSTS 本地纯 HTTP(8183,无 TLS)下
    # 浏览器会忽略,不影响本地联调;生产走真实 HTTPS 时才会生效,保留是为了这份配置可以
    # 直接整段搬到生产 vhost,不用另外补。
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # AI 对话/搜索概览 sidecar。SSE 流式必须关闭代理缓冲+拉长读超时,否则前端收不到增量
    # (见 ai/deploy/nginx-ai.conf,线上生产 nginx 用的是同一套指令)。
    location ^~ /api/site/v1/ai/ {
      limit_req zone=ai_zone burst=10 nodelay;
      proxy_pass http://ai;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
      chunked_transfer_encoding on;
    }
    # 商业分析边车(区域投资地图/排行/外资/新注册等)。^~ 命中即停,不再往下试正则(避免被 .html 规则误吞)。
    location ^~ /api/site/v1/analytics/ {
      limit_req zone=analytics_zone burst=30 nodelay;
      proxy_pass http://analytics;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # 董事反查边车(证件号反查等 PII 接口,限流独立收紧于应用层限流之外再加一道)
    location ^~ /api/site/v1/directors/ {
      limit_req zone=directors_zone burst=15 nodelay;
      proxy_pass http://directors;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # 公司视角的关联网络/认领状态,同样由董事反查边车处理(directors/src/server.js
    # 的 RELATED_RE/NETWORK_RE/CLAIM_RE),路径不带 /directors/ 前缀,需单独转发。
    location ^~ /api/site/v1/companies/ {
      limit_req zone=directors_zone burst=15 nodelay;
      proxy_pass http://directors;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # SEO sitemap:robots.txt + XML 索引/子文件,精确匹配优先级天然最高,遮蔽 WooCMS 原生 /sitemap.xml
    # (实测原生端点硬编码只出前5000条、公司链接走不经 resolver 的野路径,见 resolver/src/sitemap.js 文件头)。
    # 这几条以及下面两条 business-* 正则都用 $http_host(原样带客户端请求的端口),不用 $host(nginx 会
    # 自动去掉端口)——生产标准端口两者等价无影响,但本地 8183 非标准端口下用 $host 会导致 sitemap.xml
    # 里所有 <loc> 缺 :8183,直接点开会打到本机没监听的 80 端口,404/连不上。
    # 生产注意：www/语言子域的主机名 301 必须排除 /robots.txt。Cloudflare Managed robots
    # 回源拿到 301 会当空正文，只保留 CF 段。生产 vhost 已按此处理并把 Host 固定为 apex。
    location = /robots.txt {
      proxy_pass http://resolver;
      proxy_set_header Host bizthai.com;
      proxy_set_header X-Forwarded-Host bizthai.com;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Google AdSense ads.txt（与生产 vhost 一致：resolver 直出）
    location = /ads.txt {
      proxy_pass http://resolver;
      proxy_set_header Host bizthai.com;
      proxy_set_header X-Forwarded-Host bizthai.com;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /sitemap.xml { proxy_pass http://resolver; proxy_set_header Host $http_host; }
    location ~ ^/sitemap-[a-z0-9-]+\.xml$ {
      proxy_pass http://resolver;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 商业分析子页(无 .html 扩展):regional-rankings + 8 个 business-* slug + sitemap 落地页 + companies
    # 全部公司目录,同样交给 resolver 做 SSR 注入(resolver/src/biz.js injectBizSlots / resolver/src/sitemap.js,
    # 数据来自 analytics 综合快照或直连 PG)。resolver/src/server.js 的 resolveBizPage()/BIZ_REDIRECT/
    # /^\/companies$/ 就是按这批路径认的,漏了这条会让它们直接落到下面的兜底 WooCMS——companies 漏了不算
    # "空 div"(WooCMS 原生 wc-data 首屏仍能渲染),但会丢失 resolver 提供的?page=N 深分页能力。
    location ~ ^/(companies|regional-rankings|sitemap|business-(company-lookup|regional-ranking|foreign-capital|new-registrations|industry-overview|regional-investment-map|owner-shareholder-leads|regional-rankings-summary))$ {
      proxy_pass http://resolver;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 上面这批无 .html 扩展页面的 /zh、/th 语言前缀变体:WooCMS 原生页面路由认这两个前缀,能吐出对应
    # 语言的壳,但"往里注内容"这一步只有 resolver 会做——漏了这条,前缀路径下这些页面壳能出、内容永远空
    # (resolver/src/server.js 的 resolveBizPage()/serveSitemapPage 已同步改成认路径前缀)。
    location ~ ^/(zh|th)/(companies|regional-rankings|sitemap|business-(company-lookup|regional-ranking|foreign-capital|new-registrations|industry-overview|regional-investment-map|owner-shareholder-leads|regional-rankings-summary))$ {
      proxy_pass http://resolver;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 历史嵌套公司 URL 先转 flat 形态，resolver 再按 permalink_routes 收敛数字/旧 slug 别名。
    location ~ ^/(zh|th)/(?:c/thaicompany|company)/([^/]+)/?$ { return 301 /$1/$2.html$is_args$args; }
    location ~ ^/(?:c/thaicompany|company)/([^/]+)/?$ { return 301 /$1.html$is_args$args; }
    # 公司/董事详情等 *.html 页面:交给 resolver 做 SSR 注入(取 WooCMS 壳 + entries API 拼面板 HTML 塞回空 div),
    # resolver 内部对认不出的路径会原样透传回 WooCMS,不会漏接。
    location ~ \.html$ {
      proxy_pass http://resolver;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 其余先经 resolver：普通内容页由它统一 canonical/hreflang 与 SSR 三语文案；资源/API/未命中
    # 路由仍会由 resolver 原样透传 WooCMS。
    location / {
      proxy_pass http://resolver;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
