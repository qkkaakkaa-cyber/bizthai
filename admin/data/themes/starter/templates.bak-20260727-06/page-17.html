<div class="starter-theme biz-auth-standalone" data-auth-page="verify">
  <main class="auth-standalone">
    <div class="auth-card">
      <a class="auth-brand" href="/" aria-label="{{ t "BizThai home" }}">
        <span class="auth-brand__mark" aria-hidden="true">B</span>
        <span class="auth-brand__text">BizThai</span>
      </a>
      <div class="auth-verify">
        <div class="auth-verify__icon" data-verify-icon aria-hidden="true">⏳</div>
        <h2 class="auth-verify__title" data-verify-title><wc-t>Verifying your email…</wc-t></h2>
        <p class="auth-verify__text" data-verify-text><wc-t>Please wait a moment.</wc-t></p>
        <div class="auth-alert" data-auth-alert hidden></div>
        <a class="auth-submit" href="/login" data-verify-login hidden><wc-t>Go to sign in</wc-t></a>
      </div>
    </div>
  </main>
</div>
