# 把 GitHub push webhook 反代到 deploy-webhook 服务(9190)。
# 放进 bizthai.com.conf(以及 www2.bizthai.com.conf)的 server{} 块,置于通用 /api/ location 之前。
#
# 安全要点:
#   1) 这个 location 必须对公网开放(GitHub 服务器要能打进来),不能像 ingest 那样加固定 IP 白名单——
#      GitHub 的 webhook 出口 IP 段很大且会变,主要防线是应用层的 X-Hub-Signature-256 签名校验。
#   2) 加一条温和限流,防止被扫描/灌包消耗资源。zone 定义在 00-rate-limits.conf(与 ai_zone/directors_zone
#      等现有 zone 同一个文件):limit_req_zone $binary_remote_addr zone=deploy_webhook_zone:10m rate=2r/s;
#   3) 不缓存;请求体上限给够 GitHub push payload 的余量。

location ^~ /api/deploy/ {
    limit_req zone=deploy_webhook_zone burst=5 nodelay;

    client_max_body_size 10m;

    proxy_pass http://127.0.0.1:9190;
    proxy_http_version 1.1;
    proxy_cache off;
    proxy_buffering off;
    proxy_set_header Host                  $host;
    proxy_set_header X-Real-IP             $remote_addr;
    proxy_set_header X-Forwarded-For       $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto     $scheme;
    proxy_set_header X-Hub-Signature-256   $http_x_hub_signature_256;
    proxy_set_header X-GitHub-Event        $http_x_github_event;
    proxy_read_timeout 200s;
    proxy_send_timeout 200s;
}
