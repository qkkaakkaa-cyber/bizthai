server
{
    proxy_cache off;
    if ($host = zh.bizthai.com) { return 410; }
    if ($uri ~ ^/zh(?:/|$)) { return 410; }
    rewrite ^/th(?:/(.*))?$ https://bizthai.com/$1 permanent;
    rewrite ^/en(?:/(.*))?$ https://en.bizthai.com/$1 permanent;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/bizthai;
        default_type text/plain;
        try_files $uri =404;
    }

    # THAIS_BIZ_DISABLED: no application or database requests.

    listen 80;
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name bizthai.com www.bizthai.com en.bizthai.com www2.bizthai.com internal.bizthai.com th.bizthai.com zh.bizthai.com;

    # Cloudflare 回源真实客户端 IP 还原(供 /api/internal/dbd/ 的 IP 白名单在 CF 代理下生效)
    #include /www/server/panel/vhost/nginx/cloudflare_realip.conf;
    #include /www/server/panel/vhost/nginx/extension/bizthai.com/*.conf;

    # 宝塔的 http 级 proxy_cache 默认按改写后的 upstream URI 缓存；/th/foo 与 /zh/foo
    # 都会被改写成 /foo，导致三语 HTML 串缓存。统一改用浏览器看到的原始 URL 作为键。
    proxy_cache_key "bizthai-th-20261030-v2:$scheme$host$request_uri";

    #CERT-APPLY-CHECK--START
    # Configuration related to file verification for SSL certificate application - Do not delete
    #include /www/server/panel/vhost/nginx/well-known/bizthai.com.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START SSL related configuration, do NOT delete or modify the next line of commented-out 404 rules
    #error_page 404/404.html;
    ssl_certificate    /www/server/panel/vhost/cert/bizthai.com/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/bizthai.com/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    # ── Cloudflare Authenticated Origin Pull:强制拦截 ──
    # 2026-07-03 加。CF 侧「全局」开关已打开(共享证书模式)。observe 阶段已用临时诊断 header 实测确认:
    # 经 CF 的请求 $ssl_client_verify=SUCCESS,绕过 CF 直连源站 IP 的请求=NONE,信号可靠,现转为强制。
    # 用 optional(不在 TLS 握手层直接拒绝无证书连接)+ HTTP 层按 $ssl_client_verify 判断是否放行,
    # 而不是直接 ssl_verify_client on ——因为 on 是连接级硬性要求,会把下面显式放行的两个直连源站的
    # 例外(本机 + DBD 同步对端 156.238.230.118,见 /api/internal/dbd/ location 的 IP 白名单)也一起挡掉。
    ssl_client_certificate /www/server/panel/vhost/cert/bizthai.com/cloudflare-aop-ca.pem;
    ssl_verify_client optional;
    set $origin_gate_block 0;
    if ($ssl_client_verify != SUCCESS) { set $origin_gate_block 1; }
    if ($realip_remote_addr = 127.0.0.1) { set $origin_gate_block 0; }
    if ($realip_remote_addr = 156.238.230.118) { set $origin_gate_block 0; }
    # ACME HTTP-01 续期验证:Let's Encrypt 校验服务器直连源站(不经 CF),源 IP 不固定不可枚举,
    # 按 RFC 8555 固定路径豁免,而非按 IP(否则下次续期证书会被此网关一起挡掉)。
    if ($request_uri ~ ^/\.well-known/acme-challenge/) { set $origin_gate_block 0; }
    if ($origin_gate_block = 1) { return 403 "origin access requires Cloudflare\n"; }
    add_header Strict-Transport-Security "max-age=31536000";
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"; h3-27=":443";h3-25=":443"; h3-T050=":443"; h3-Q050=":443"; h3-Q049=":443"; h3-Q048=":443"; h3-Q046=":443"; h3-Q043=":443"';
    # sub_filter 会处理 HTML 并清理标准验证头；从 resolver 内部头恢复给浏览器，内部头不外露。
    proxy_hide_header X-BizThai-Last-Modified;
    add_header Last-Modified $upstream_http_x_bizthai_last_modified always;
    error_page 497  https://$host$request_uri;
    #SSL-END

    error_page 404 /404.html;
    error_page 502 /502.html;

    # 主机名收敛到规范域。但 /robots.txt 必须排除：Cloudflare「Managed robots.txt」
    # 回源若拿到 301 会当成空正文，只吐 CF 段（丢掉源站 Disallow + Sitemap）。
    # 实测 www/th/cn/zh 的 /robots.txt 经 CF 后只剩 1836 字节 CF 段；源站直连 www 则是 301。
    # 对 /robots.txt 直接回源输出（Sitemap 本身已写死 https://bizthai.com），其它路径照旧跳转。
    set $canon_host_redirect "";
    if ($host = www.bizthai.com) { set $canon_host_redirect "www"; }
    if ($host = www2.bizthai.com) { set $canon_host_redirect "www2"; }
    if ($host = internal.bizthai.com) { set $canon_host_redirect "internal"; }
    if ($host = th.bizthai.com) { set $canon_host_redirect "th"; }
    if ($host = cn.bizthai.com) { set $canon_host_redirect "cn"; }
    if ($host = zh.bizthai.com) { set $canon_host_redirect "zh"; }
    if ($uri = /robots.txt) { set $canon_host_redirect ""; }
    # ads.txt 同理：子域若 301 成 /th/ads.txt 会让 AdSense 校验失败。
    if ($uri = /ads.txt) { set $canon_host_redirect ""; }
    if ($canon_host_redirect = "www") { return 301 https://bizthai.com$request_uri; }
    if ($canon_host_redirect = "www2") { return 301 https://bizthai.com$request_uri; }
    if ($canon_host_redirect = "internal") { return 301 https://bizthai.com$request_uri; }
    if ($canon_host_redirect = "th") { return 301 https://bizthai.com/th$request_uri; }
    if ($canon_host_redirect = "cn") { return 301 https://bizthai.com/zh$request_uri; }
    if ($canon_host_redirect = "zh") { return 301 https://bizthai.com/zh$request_uri; }

    # 访客走明文 HTTP 时收敛到 HTTPS。排除 ACME；也排除 /robots.txt——CF Managed robots
    # 若回源拿到 301 会当空正文（与上方主机名收敛同一坑）。robots 本身无敏感内容，
    # 由 CF Always Use HTTPS / HSTS 负责把访客导到 HTTPS 即可。
    set $http_to_https 0;
    if ($scheme = http) { set $http_to_https 1; }
    if ($request_uri ~ ^/\.well-known/acme-challenge/) { set $http_to_https 0; }
    if ($uri = /robots.txt) { set $http_to_https 0; }
    if ($uri = /ads.txt) { set $http_to_https 0; }
    if ($http_to_https = 1) { return 301 https://bizthai.com$request_uri; }

    # /en 和 /en/ → 301 到根路径（英文已是默认语言，无前缀）
    location = /en { return 301 /; }
    location = /en/ { return 301 /; }
    location = /th { return 301 /th/; }
    location = /zh { return 301 /zh/; }

    # 畸形堆叠语言前缀必须在下面的 /th/*、/zh/* 代理规则剥掉第一层之前收敛。
    # 保留最外层语言，删除后续所有语言段：
    # /th/zh/page → /th/page，/zh/zh/page → /zh/page。
    location ~ ^/(th|zh)(?:/(?:th|zh))+(/.*)?$ {
        return 301 /$1$2$is_args$args;
    }

    # 所有 /en/xxx → 301 去掉前缀
    location ~ ^/en/(.*)$ {
        return 301 /$1$is_args$args;
    }

    location = /th/ {
        proxy_pass http://127.0.0.1:9186/;
        proxy_http_version 1.1;
        proxy_set_header Host              th.bizthai.com;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        #include /www/server/panel/vhost/nginx/extension/bizthai.com/lang_path_alternates.inc;
    }

    location = /zh/ {
        proxy_pass http://127.0.0.1:9186/;
        proxy_http_version 1.1;
        proxy_set_header Host              cn.bizthai.com;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        #include /www/server/panel/vhost/nginx/extension/bizthai.com/lang_path_alternates.inc;
    }

    location ~ ^/th/(.+\.html)$ {
        proxy_pass http://127.0.0.1:9186/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host              th.bizthai.com;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Resolver 自身回源预算为 15s；保留少量渲染余量，但不能让断开的爬虫连接堆积 5 分钟。
        proxy_read_timeout 45s;
        #include /www/server/panel/vhost/nginx/extension/bizthai.com/lang_path_alternates.inc;
    }

    location ~ ^/zh/(.+\.html)$ {
        proxy_pass http://127.0.0.1:9186/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host              cn.bizthai.com;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 45s;
        #include /www/server/panel/vhost/nginx/extension/bizthai.com/lang_path_alternates.inc;
    }

    location ~ ^/th/(business-(company-lookup|regional-ranking|foreign-capital|new-registrations|industry-overview|regional-investment-map|owner-shareholder-leads|regional-rankings-summary|leaderboards)|regional-rankings|trending-companies)$ {
        proxy_pass http://127.0.0.1:9186/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host              th.bizthai.com;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        #include /www/server/panel/vhost/nginx/extension/bizthai.com/lang_path_alternates.inc;
    }

    location ~ ^/zh/(business-(company-lookup|regional-ranking|foreign-capital|new-registrations|industry-overview|regional-investment-map|owner-shareholder-leads|regional-rankings-summary|leaderboards)|regional-rankings|trending-companies)$ {
        proxy_pass http://127.0.0.1:9186/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host              cn.bizthai.com;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        #include /www/server/panel/vhost/nginx/extension/bizthai.com/lang_path_alternates.inc;
    }

    # 历史嵌套路由统一收敛到 flat URL；resolver 会再把纯注册号别名收敛到英文名 permalink。
    location ~ ^/(th|zh)/(?:c/thaicompany|company)/([^/]+)/?$ {
        return 301 /$1/$2.html$is_args$args;
    }

    location ~ ^/th/(.+)$ {
        proxy_pass http://127.0.0.1:9186/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host              th.bizthai.com;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        #include /www/server/panel/vhost/nginx/extension/bizthai.com/lang_path_alternates.inc;
    }

    location ~ ^/zh/(.+)$ {
        proxy_pass http://127.0.0.1:9186/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host              cn.bizthai.com;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        #include /www/server/panel/vhost/nginx/extension/bizthai.com/lang_path_alternates.inc;
    }

    location ^~ /api/site/v1/analytics/ {
        limit_req zone=analytics_zone burst=30 nodelay;
        proxy_cache off;
        proxy_pass http://127.0.0.1:9184;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── 通用模型 API(/api/site/v1/models/):限流,防匿名整包拉库 + PII(cmtNo)采集 ──
    # 此前无独立 location,落到催底 location / 直连 9183 且零限流。行为保持不变(仍代理 9183),仅加限流。
    # 站内 JS 消费的只是公司名/slug + total(首页随机墙、详情页单条),不需要 committees/cmtNo;
    # 见 00-rate-limits.conf 的 models_zone 说明。2026-07-03 加。
    location ^~ /api/site/v1/models/ {
        limit_req zone=models_zone burst=20 nodelay;
        limit_conn conn_per_ip 15;   # 每 IP 并发上限,防重查询并发打垮 9183(见 00-rate-limits.conf)
        proxy_cache off;
        # 深 OFFSET 成本上限:WooCMS 这个通用接口用 SQL OFFSET 分页(O(N),扫描并丢弃前 N 行)。
        # 实测 offset=10万→单查询1.3s,offset≈190万→~20s。既是 DoS 面也是深翻页拖库面。
        # offset≥100000(6位数及以上)一律拒。$arg_offset 为空(如 /entries/{id} 单条、/aggregate)不受影响。
        # 已知副作用:首页随机公司墙(theme.js randomize)取 >10万 的随机 offset 时会收到 429,
        # 前端 catch 静默兜底到 SSR 内容——页面正常,只是那部分不再随机重排。彻底修复见给上游的反馈。
        if ($arg_offset ~ "^[0-9]{6,}$") { return 429 '{"error":"offset_too_large"}'; }
        # 公网 models 请求改走脱敏+配额代理(9189),它再回源 9183。作用:剥 cmtNo/董事手机/地址、
        # 按账号+IP 配额、爬虫判定拦截。内部 SSR/analytics 仍直连 9183,不经此路,拿全量不受影响。
        # 2026-07-04 加。见 dbd-thai/sanitizer/。
        proxy_pass http://127.0.0.1:9189;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ^~ /api/site/v1/ai/ {
        limit_req zone=ai_zone burst=10 nodelay;
        proxy_pass http://127.0.0.1:9187;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    location ^~ /api/site/v1/directors/ {
        limit_req zone=directors_zone burst=15 nodelay;
        proxy_cache off;
        proxy_pass http://127.0.0.1:9185;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Private-Fields  "";  # 清除用户伪造的私有 header
        proxy_read_timeout 30s;
    }

    # ── DBD 增量同步接收端(内部写入口,仅对端同步服务器 IP;直写 meta_json)──
    location ^~ /api/internal/dbd/ {
        allow 127.0.0.1;
        allow 156.238.230.118;          # 对端同步服务器出口 IP
        deny all;
        client_max_body_size 64m;
        proxy_pass http://127.0.0.1:9188;
        proxy_http_version 1.1;
        proxy_cache off;
        proxy_buffering off;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # GitHub push webhook 接收端(deploy-webhook,9190)。必须对公网开放(GitHub 要能打进来),
    # 不能像上面 /api/internal/dbd/ 那样加 IP 白名单——GitHub 出口 IP 段大且会变,主要防线是
    # 应用层 X-Hub-Signature-256 签名校验;这里只加温和限流兜底。见 dbd-thai/deploy-webhook/README.md。
    location ^~ /api/deploy/ {
        limit_req zone=deploy_webhook_zone burst=5 nodelay;
        client_max_body_size 10m;
        proxy_pass http://127.0.0.1:9190;
        proxy_http_version 1.1;
        proxy_cache off;
        proxy_buffering off;
        proxy_set_header Host                  $host;
        proxy_set_header X-Real-IP             $remote_addr;
        proxy_set_header X-Forwarded-For       $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto     $scheme;
        proxy_set_header X-Hub-Signature-256   $http_x_hub_signature_256;
        proxy_set_header X-GitHub-Event        $http_x_github_event;
        proxy_read_timeout 200s;
        proxy_send_timeout 200s;
    }

    location ~ ^/api/site/v1/companies/[^/]+/(related|network|claim-status)$ {
        limit_req zone=directors_zone burst=15 nodelay;
        proxy_cache off;
        proxy_pass http://127.0.0.1:9185;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ~ ^/(business-(company-lookup|regional-ranking|foreign-capital|new-registrations|industry-overview|regional-investment-map|owner-shareholder-leads|regional-rankings-summary|leaderboards)|regional-rankings|sitemap|trending-companies)$ {
        proxy_pass http://127.0.0.1:9186;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # /th、/zh 前缀变体:同上,漏了这条前缀路径下页面壳能出但内容永远空
    location ~ ^/(th|zh)/(business-(company-lookup|regional-ranking|foreign-capital|new-registrations|industry-overview|regional-investment-map|owner-shareholder-leads|regional-rankings-summary|leaderboards)|regional-rankings|sitemap|trending-companies)$ {
        proxy_pass http://127.0.0.1:9186;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SEO sitemap:robots.txt + XML 索引/子文件,遮蔽 WooCMS 原生 /sitemap.xml(硬编码只出前5000条、
    # 公司链接走不经 resolver 的野路径)。见 dbd-thai/ops/nginx.local.conf 参考实现。
    # Host 固定 apex：www/子域也会命中此 location（见上方 canon 排除），避免 resolver 偶发按 Host 分支。
    location = /robots.txt {
        proxy_pass http://127.0.0.1:9186;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    # llms.txt / llms-full.txt:遮蔽 WooCMS 原生端点(内核自带的后台 API 文档索引,不是站点内容
    # 说明),改由 resolver 出本站专属版本,见 resolver/src/sitemap.js buildLlmsTxt。
    location = /llms.txt {
        proxy_pass http://127.0.0.1:9186;
        proxy_set_header Host $host;
    }
    location = /llms-full.txt {
        proxy_pass http://127.0.0.1:9186;
        proxy_set_header Host $host;
    }
    # Bing 站长验证文件(XML 文件法),由 resolver 静态吐出。
    location = /BingSiteAuth.xml {
        proxy_pass http://127.0.0.1:9186;
        proxy_set_header Host $host;
    }
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:9186;
        proxy_set_header Host $host;
    }
    # 各 sitemap 头部 <?xml-stylesheet href="/sitemap.xsl"?> 引用的浏览器端 XSLT 样式表(渲染成可点击表格)。
    # 必须同源,故也转发到 resolver。
    location = /sitemap.xsl {
        proxy_pass http://127.0.0.1:9186;
        proxy_set_header Host $host;
    }
    location ~ ^/sitemap-[a-z0-9-]+\.xml$ {
        proxy_pass http://127.0.0.1:9186;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(?:c/thaicompany|company)/([^/]+)/?$ {
        return 301 /$1.html$is_args$args;
    }

    # 企业微站裸路径(如后台「查看」按钮直接用 permalink_pattern 拼出的地址)301 到 .html,
    # 落到下方 `location ~ \.html$` 走 resolver SSR 注入;否则会落到兜底 location / 直连 WooCMS,
    # 拿到的是没有 data-panel 内容的空壳。
    location ~ ^/b2b-([^/.]+)/?$ {
        return 301 /b2b-$1.html$is_args$args;
    }

    # 旧的 /microsite/{slug} 方案(已改成扁平 /b2b-{slug}.html)留一条兼容跳转,避免旧链接变死链。
    location ~ ^/microsite/([^/.]+)(?:\.html)?/?$ {
        return 301 /b2b-$1.html$is_args$args;
    }

    # 公司页伪静态：所有 *.html（含公司详情）统一反代到 resolver(8186)，由其解析 slug→jpNo、
    # 服务端注入数据（SSR，爬虫可抓）再返回；未命中则透传 WooCMS。见下方 `location ~ \.html$`。
    # （原先这里直接打到 8183/company/$1，会绕过 resolver → 英文名 slug 公司 SSR 缺失 + 前端 loadError）
    location ~ \.html$ {
        limit_conn conn_per_ip 15;   # 每 IP 并发上限:详情页 SSR 经 resolver 回打 9183,同样要防并发压垮
        # 公开 HTML 短缓存；登录 session / POST 由 $no_cache 绕过
        # 覆盖 WooCMS 旧 th./cn. 子域 Link,改路径型 hreflang
        #include /www/server/panel/vhost/nginx/extension/bizthai.com/lang_path_alternates.inc;
        proxy_cache off;
        proxy_cache_key        "$scheme$host$request_uri$is_args$args";
        proxy_cache_valid      200 5m;
        proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock       on;
        proxy_cache_bypass     $no_cache;
        proxy_no_cache         $no_cache;

        proxy_pass http://127.0.0.1:9186;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 45s;
    }

    # Google AdSense ads.txt（授权广告商声明，必须放在站点根路径）
    # 与 robots.txt 一样走 resolver 直出，避免 alias 404 被 error_page 吃进 WooCMS 壳。
    location = /ads.txt {
        proxy_pass http://127.0.0.1:9186;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # favicon 静态文件（浏览器自动请求这些路径）
    location = /favicon.ico {
        alias /www/wwwroot/bizthai/dbd-thai/admin/data/themes/starter/assets/favicon.ico;
        expires 1y;        log_not_found off;
        access_log off;
    }
    location = /favicon.svg {
        alias /www/wwwroot/bizthai/dbd-thai/admin/data/themes/starter/assets/favicon.svg;
        expires 1y;        log_not_found off;
        access_log off;
    }
    location = /apple-touch-icon.png {
        alias /www/wwwroot/bizthai/dbd-thai/admin/data/themes/starter/assets/apple-touch-icon.png;
        expires 1y;        log_not_found off;
        access_log off;
    }

    # 静态图片资源(小程序等外部消费,不走任何后端服务)。^~ 确保优先于下方正则 location 命中。
    location ^~ /images/ {
        alias /www/wwwroot/bizthai/static/images/;
        expires 30d;        access_log off;
    }

    # 公共缓存配置片段（map 变量控制登录用户绕过缓存）
    # 缓存辅助变量：有 woocms_session cookie 的登录用户不走缓存
    set $no_cache 0;
    if ($http_cookie ~* "woocms_session|wc_session") { set $no_cache 1; }
    if ($request_method = POST)                       { set $no_cache 1; }

    # 向所有 HTML 响应的 </head> 前注入 favicon link 标签
    sub_filter '</head>' '<link rel="icon" type="image/x-icon" href="/favicon.ico"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="apple-touch-icon" href="/apple-touch-icon.png"></head>';
    sub_filter_once on;
    sub_filter_types text/html;
    # resolver 为匿名 HTML 提供 Last-Modified/304；favicon 的确定性 sub_filter 不应清掉验证器。
    sub_filter_last_modified on;

    # ── 统一入口:首页始终返回英文 200（不做 Accept-Language/Cookie 自动 302；语言切换走 UI 链接）──
    location = / {
        proxy_pass http://127.0.0.1:9186/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        #include /www/server/panel/vhost/nginx/extension/bizthai.com/lang_path_alternates.inc;
    }

    # ── 公司列表页多语言变体(th/zh),同上原因改走 resolver ──────
    location = /th/companies {
        proxy_pass http://127.0.0.1:9186/companies$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host              th.bizthai.com;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /zh/companies {
        proxy_pass http://127.0.0.1:9186/companies$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host              cn.bizthai.com;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── 公司列表页（含省份/行业筛选参数）─────────────────────
    # 2026-07-02 改走 resolver(9186),否则 ?page=N 翻页不生效(DEPLOYMENT.md 6.1)
    location = /companies {
        proxy_cache off;
        proxy_cache_key        "$scheme$host$request_uri$is_args$args";
        proxy_cache_valid      200 10m;
        proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock       on;
        proxy_cache_bypass     $no_cache;
        proxy_no_cache         $no_cache;

        proxy_pass http://127.0.0.1:9186;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── 行业 / 省份分类页（taxonomy term 页）─────────────────
    location ~ ^/t/ {
        limit_conn woo_global 3;
        limit_conn_status 503;
        proxy_cache off;
        proxy_cache_key        "$scheme$host$request_uri$is_args$args";
        proxy_cache_valid      200 30m;
        proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock       on;
        proxy_cache_bypass     $no_cache;
        proxy_no_cache         $no_cache;

        proxy_pass http://127.0.0.1:9183;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── 其余页面（公司详情、搜索、API 等不缓存）─────────────
    # 账户相关页走 resolver：注入 noindex + 路径型 hreflang（勿直打 WooCMS 旧子域 Link）
    location ~ ^/(?:(?:th|zh)/)?(?:login|register|forgot-password|reset-password|account|verify-email)/?$ {
        proxy_pass http://127.0.0.1:9186;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        #include /www/server/panel/vhost/nginx/extension/bizthai.com/lang_path_alternates.inc;
    }

    location / {
        limit_conn woo_global 3;
        limit_conn_status 503;
        proxy_cache off;
        proxy_pass http://127.0.0.1:9186;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 45s;
    }

    location ~ /\.ht {
        deny all;
    }

    access_log  /www/wwwlogs/bizthai.com.log;
    error_log  /www/wwwlogs/bizthai.com.error.log;
}
