# bizthai 站点所需的 http 层指令。原环境写在 nginx.conf 的 http 块内，
# 本机不覆盖 nginx.conf，改由此文件提供（vhost/nginx/*.conf 被 include 在 http 上下文）。
# 恢复自 2026-07-21 备份的 config-bundle，2026-07-23。




        proxy_cache_path /tmp/nginx_cache/bizthai levels=1:2 keys_zone=bizthai_page:20m max_size=500m inactive=60m use_temp_path=off;

        # 2026-07-27:取消按浏览器 Accept-Language / cookie 自动跳 /zh|/th。
        # 语言只跟 URL 前缀走(无前缀=英文);下列 map 保留为恒不跳转的哑变量,避免旧 location 引用报错。
        map $http_cookie $bizthai_cookie_lang {
            default "";
        }

        map $http_accept_language $bizthai_browser_lang {
            default "";
        }

        map $bizthai_cookie_lang $bizthai_entry_lang {
            default "";
        }

        map $bizthai_entry_lang $bizthai_should_redirect {
            default 0;
        }

        map $uri $bizthai_langless_path {
            ~^/(?:th|zh)/(.*)$ /$1;
            ~^/(?:th|zh)$ /;
            default $uri;
        }
